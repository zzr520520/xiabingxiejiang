name: Build FloatingMenu dylib

on:
  push:
    paths:
      - 'FloatingMenu.m'
      - '.github/workflows/build-floatmenu.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile dylib
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun --sdk iphoneos clang -dynamiclib -arch arm64 -fobjc-arc \
            -isysroot "$SDK" -miphoneos-version-min=14.0 \
            -framework UIKit -framework Foundation \
            -install_name @executable_path/Frameworks/libFloatingMenu.dylib \
            -o libFloatingMenu.dylib FloatingMenu.m
          codesign -f -s - libFloatingMenu.dylib
          lipo -info libFloatingMenu.dylib
          otool -L libFloatingMenu.dylib

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: FloatingMenu-dylib
          path: libFloatingMenu.dylib
